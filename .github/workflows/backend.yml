name: Backend cloud configuration checks
on:
  push:
    branches: [cloud-config, main]
    paths: ['infra/**', 'backend_cloud/**', 'scripts/test_backend_postgres.sh', '.github/workflows/backend.yml', 'docs/BACKEND_CLOUD_CONTRACT.md', 'docs/BACKEND_DEPLOYMENT.md']
  pull_request:
    branches: [cloud-config, main]
    paths: ['infra/**', 'backend_cloud/**', 'scripts/test_backend_postgres.sh', '.github/workflows/backend.yml', 'docs/BACKEND_CLOUD_CONTRACT.md', 'docs/BACKEND_DEPLOYMENT.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.1'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: |
            infra/uv.lock
            backend_cloud/uv.lock
      - run: uv sync --locked
        working-directory: infra
      - run: uv sync --locked --project backend_cloud
      - name: Check infrastructure boundaries
        run: uv run --locked pytest -q
        working-directory: infra
      - run: npm ci
        working-directory: infra
      - name: Synthesize full backend with test-only images (no deployment)
        run: npx cdk synth --strict --quiet --no-lookups -c enable_auth=true -c enable_backend=true -c enable_backend_operations=true -c enable_backend_runtime=true -c backend_config=tests/fixtures/backend-runtime.json
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: '825990809862'
          CDK_DEFAULT_REGION: ap-southeast-1
          AWS_REGION: ap-southeast-1
          AWS_DEFAULT_REGION: ap-southeast-1
      - name: Verify bootstrap image builds
        run: docker build -t spip-database-bootstrap:ci backend_cloud
      - name: Fetch pinned backend migrations without modifying application branches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 27cc9fb7c6d0b0ae21057e5ba1a4bfb8b90cbe2e
          path: backend-source
          persist-credentials: false
      - name: Exercise database grants and tenant-context isolation using disposable PostgreSQL
        run: bash scripts/test_backend_postgres.sh
        env:
          SPIP_TEST_BACKEND_SOURCE: ${{ github.workspace }}/backend-source
