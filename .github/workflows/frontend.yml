name: Frontend checks and AWS deployment

on:
  push:
    branches: [cloud-config, main]
    paths: ['frontend/**', 'infra/**', 'scripts/**', 'tests/**', '.github/workflows/frontend.yml']
  pull_request:
    branches: [cloud-config, main]
    paths: ['frontend/**', 'infra/**', 'scripts/**', 'tests/**', '.github/workflows/frontend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infrastructure-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.1'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: infra/uv.lock
      - run: uv sync --locked
        working-directory: infra
      - run: uv run --locked pytest -q
        working-directory: infra
      - run: python -m unittest discover -s tests -p "test_*_frontend.py" -v
      - run: npm ci
        working-directory: infra
      - run: npx cdk synth --strict --quiet
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: '825990809862'
          CDK_DEFAULT_REGION: ap-southeast-1
          AWS_REGION: ap-southeast-1
          AWS_DEFAULT_REGION: ap-southeast-1
      - name: Synthesize independent login module without AWS credentials
        run: npx cdk synth AuthStack --strict --quiet --no-lookups -c enable_auth=true
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: '825990809862'
          AWS_REGION: ap-southeast-1
          AWS_DEFAULT_REGION: ap-southeast-1

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_AUTH_ISSUER: ${{ vars.VITE_AUTH_ISSUER }}
          VITE_AUTH_CLIENT_ID: ${{ vars.VITE_AUTH_CLIENT_ID }}
          VITE_AUTH_DOMAIN: ${{ vars.VITE_AUTH_DOMAIN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: [infrastructure-checks, frontend-build]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Both trusted branches target one development site; serialize all releases.
    concurrency:
      group: spip-frontend-dev
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      AWS_ACCOUNT_ID: '825990809862'
      FRONTEND_BUCKET_NAME: ${{ vars.FRONTEND_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      DEPLOY_ROLE_ARN: ${{ vars.FRONTEND_DEPLOY_ROLE_ARN }}
    steps:
      - name: Require the one-time AWS setup
        shell: bash
        run: |
          for name in FRONTEND_BUCKET_NAME CLOUDFRONT_DISTRIBUTION_ID FRONTEND_URL DEPLOY_ROLE_ARN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository variable $name. See docs/FRONTEND_DEPLOYMENT.md."
              exit 1
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-${{ github.sha }}
          path: frontend/dist/
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '825990809862'
          role-session-name: frontend-${{ github.run_id }}
          role-duration-seconds: 1800
      - name: Publish assets, HTML, and release metadata
        run: python scripts/deploy_frontend.py
      - name: Verify the published release
        run: python scripts/verify_frontend.py "$FRONTEND_URL" "$GITHUB_SHA"
      - name: Record release
        shell: bash
        run: |
          printf 'Website: %s\n\nCommit: `%s`\n' "$FRONTEND_URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
